<h2>Lista de Espera</h2>
<div id="espera-container"></div>

<script>
function cargarListaEspera() {
  fetch("get_lista_espera.php")
    .then(res => res.json())
    .then(data => {
      let html = "<table border='1' cellpadding='6'><tr><th>Nombre</th><th>Fecha Registro</th><th>Acciones</th></tr>";
      data.forEach(persona => {
        html += `<tr>
                  <td>${persona.nombre} ${persona.apellido}</td>
                  <td>${persona.fecha_registro}</td>
                  <td>
                    <button onclick="asignarCurso(${persona.id_espera})">Asignar Curso</button>
                    <button onclick="descartar(${persona.id_espera})">Descartar</button>
                  </td>
                </tr>`;
      });
      html += "</table>";
      document.getElementById("espera-container").innerHTML = html;
    });
}

function asignarCurso(id) {
  let curso = prompt("Ingrese ID del curso para asignar:");
  if (!curso) return;
  fetch("asignar_curso.php", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "id_espera=" + id + "&id_curso=" + curso
  }).then(() => cargarListaEspera());
}

function descartar(id) {
  fetch("descartar.php", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "id_espera=" + id
  }).then(() => cargarListaEspera());
}

// Refrescar cada 10 segundos
setInterval(cargarListaEspera, 10000);
cargarListaEspera();
</script>
